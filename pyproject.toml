[project]
name = "tts-benchmark"
version = "0.1.0"
description = "Emotion-aware TTS benchmark for main metric design and later surrogate metric search."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
